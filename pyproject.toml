[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmmc-scorecard"
version = "1.0.0"
description = "Generate CMMC 2.0 Level 2 compliance scorecards, gap analysis, and OSCAL Assessment Results from security findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cmmc-scorecard contributors" }]
keywords = ["cmmc", "nist-800-171", "compliance", "oscal", "security", "prowler", "security-hub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
cmmc-scorecard = "cmmc_scorecard.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/cmmc-scorecard"
Issues = "https://github.com/your-org/cmmc-scorecard/issues"

[tool.setuptools]
packages = ["cmmc_scorecard"]

[tool.setuptools.package-data]
cmmc_scorecard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
